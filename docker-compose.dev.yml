# Development override (ARCHITECTURE.md 10 and 12.1). Never use on the department PC.
# Used by the npm scripts dev:db and test:db:
#   docker compose -f docker-compose.yml -f docker-compose.dev.yml ...

services:
  # Publish the development database to this machine only, for `npm run dev` and `npm run db:migrate`.
  db:
    ports:
      - '127.0.0.1:5432:5432'

  # Throwaway database for integration tests (ARCHITECTURE.md 11). Only starts with --profile test.
  # Data lives in memory (tmpfs) and is wiped when the container stops. It accepts connections
  # without a password, so it is bound to 127.0.0.1 and must never hold real data.
  db-test:
    image: postgres:18.6-bookworm
    profiles: ['test']
    environment:
      POSTGRES_USER: bms
      POSTGRES_DB: bms_test
      POSTGRES_HOST_AUTH_METHOD: trust
      TZ: Asia/Manila
    # Same timeouts as the real database (ARCHITECTURE.md 12.5).
    command:
      - postgres
      - -c
      - statement_timeout=15000
      - -c
      - lock_timeout=5000
      - -c
      - idle_in_transaction_session_timeout=15000
    tmpfs:
      - /var/lib/postgresql
    ports:
      - '127.0.0.1:5433:5432'
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U bms -d bms_test']
      interval: 2s
      timeout: 5s
      retries: 15
