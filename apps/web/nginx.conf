# Header, body, and timeout limits from ARCHITECTURE.md 12.2.
# Rate and connection limits (limit_req, limit_conn) are added in SEC-1.
# Settings are inside the server block so they override the image's defaults in nginx.conf.

server {
    listen 8080;
    root /usr/share/nginx/html;
    server_tokens off;

    # Slow-connection protection.
    client_header_timeout 10s;
    client_body_timeout 10s;
    send_timeout 15s;
    keepalive_timeout 15s;

    client_max_body_size 100k;
    # The 2m limit for the CSV import location is added with MD-6.

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;

    # Docker healthcheck. Never touches the API.
    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    location /api/ {
        proxy_pass http://api:3000;
        proxy_set_header Host $host;
        # Overwrite, never append, so a client cannot fake its address (rate limits key on it).
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 30s;
    }

    # Vite puts hashed file names in /assets, so they can be cached for a long time.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # Single-page app: unknown paths load index.html and React Router handles them.
    # no-cache: browsers check for a new index.html on every load, so they pick up the new
    # /assets file names after an update instead of running the old build from cache.
    location / {
        add_header Cache-Control "no-cache";
        try_files $uri /index.html;
    }
}
