# Limits from ARCHITECTURE.md 12.2. Checked through nginx by `npm run test:nginx`.
# This file is included inside the image's http block, so the zones below are http-level.
# Settings in the server block override the image's defaults in nginx.conf.

# Request rates and open connections, per client address.
limit_req_zone $binary_remote_addr zone=api:10m rate=10r/s;
limit_req_zone $binary_remote_addr zone=login:10m rate=5r/m;
limit_req_zone $binary_remote_addr zone=csv_import:10m rate=2r/m;
limit_conn_zone $binary_remote_addr zone=per_ip:10m;

server {
    listen 8080;
    root /usr/share/nginx/html;
    server_tokens off;

    # Slow-connection protection.
    client_header_timeout 10s;
    client_body_timeout 10s;
    send_timeout 15s;
    keepalive_timeout 15s;

    client_max_body_size 100k;

    limit_conn per_ip 30;
    limit_conn_status 429;
    limit_req_status 429;

    # nginx's own 413 and 429 use the API error format (ARCHITECTURE.md 7), never an HTML page.
    # Retry-After is about the time one more request is allowed: 1 s here, more on login.
    set $retry_after 1;
    error_page 413 = @payload_too_large;
    error_page 429 = @rate_limited;

    location @payload_too_large {
        default_type application/json;
        return 413 '{"error":{"code":"PAYLOAD_TOO_LARGE","message":"The request is too large.","details":{}}}';
    }

    location @rate_limited {
        default_type application/json;
        add_header Retry-After $retry_after always;
        return 429 '{"error":{"code":"RATE_LIMITED","message":"Too many requests. Try again later.","details":{}}}';
    }

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;

    # Docker healthcheck. Never touches the API.
    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    location /api/ {
        limit_req zone=api burst=30 nodelay;
        proxy_pass http://api:3000;
        proxy_set_header Host $host;
        # Overwrite, never append, so a client cannot fake its address (rate limits key on it).
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 30s;

        # Login has its own, much lower rate (instead of the general one). The proxy headers above apply.
        location = /api/auth/login {
            limit_req zone=login burst=5 nodelay;
            set $retry_after 12;
            proxy_pass http://api:3000;
        }

        # Borrower CSV import (MD-6): up to 2 MB, 2 a minute (burst 1, so a corrected file can be
        # sent again right away). Retry-After is the 30 s until one more import is allowed.
        location = /api/borrowers/import {
            client_max_body_size 2m;
            limit_req zone=csv_import burst=1 nodelay;
            set $retry_after 30;
            proxy_pass http://api:3000;
        }
    }

    # Vite puts hashed file names in /assets, so they can be cached for a long time.
    # One header only: `expires` would add a second Cache-Control.
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # Single-page app: unknown paths load index.html and React Router handles them.
    # no-cache: browsers check for a new index.html on every load, so they pick up the new
    # /assets file names after an update instead of running the old build from cache.
    location / {
        add_header Cache-Control "no-cache";
        try_files $uri /index.html;
    }
}
